version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_sentinel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_URL=sqlite:////app/data/api_sentinel.db
      - ALLOW_LOCAL_LAB_SCANNING=True
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
    volumes:
      - sentinel_data:/app/data
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  demo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_sentinel_demo_api
    restart: unless-stopped
    command: ["uvicorn", "demo_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - DEMO_VULNERABLE_MODE=true
      - ENABLE_SECURITY_HEADERS=false
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  sentinel_net:
    driver: bridge

volumes:
  sentinel_data:
    driver: local
